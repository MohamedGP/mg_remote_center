<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MG Remote Center</title>
<style>
:root{--bg:#14161a;--card:#1f2329;--line:#333a44;--fg:#eceff4;--mut:#8b94a3;--acc:#3b82f6;--ok:#22c55e;--bad:#ef4444}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Tahoma,sans-serif}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;direction:ltr;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.hl{justify-self:start;position:relative}
.hr{justify-self:end;direction:rtl;display:flex;align-items:center;font-size:14px}
.ttl{font-weight:800;font-size:22px;letter-spacing:.5px;text-align:center}
.ttl b{color:var(--acc)}
.ttl span{color:var(--mut);font-weight:600}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc)}
button.bad{color:var(--bad)}
#gear{font-size:20px;padding:4px 11px;line-height:1.3}
#menu{position:absolute;top:calc(100% + 6px);left:0;direction:rtl;background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:200px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:10}
#menu button{display:block;width:100%;border:0;border-radius:0;text-align:right;padding:12px 16px;background:none}
#menu button+button{border-top:1px solid var(--line)}
#menu button:hover{background:#2a3038}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad);display:inline-block;margin-inline-end:6px}
.dot.on{background:var(--ok)}
main{max-width:900px;margin:0 auto;padding:16px}
#q{width:100%;padding:11px 14px;margin-bottom:14px;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;outline:none}
#q:focus{border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;text-align:center}
.card img{width:100%;height:150px;object-fit:contain;background:#000;display:block}
.card div{padding:8px;font-size:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar h2{margin:0;font-size:18px}

.editor-layout{display:flex;gap:16px;justify-content:center;align-items:flex-start;position:relative}
.stage{position:relative;width:300px;min-height:500px;background:#111;user-select:none;touch-action:none;flex-shrink:0;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.stage img{width:100%;display:block;pointer-events:none}

#selbar{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);padding:12px;border-radius:12px;width:200px;box-shadow:0 8px 24px rgba(0,0,0,.6);position:sticky;top:70px}
#selbar button{width:100%;text-align:right}

.key{position:absolute;transform:translate(-50%,-50%);min-width:10px;min-height:10px;padding:2px;border-radius:50%;background:transparent;border:2px solid transparent;color:transparent;font-size:0;display:flex;align-items:center;justify-content:center;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent}
.key.flash{background:rgba(255,255,255,.35)}
.edit .key{cursor:grab;background:rgba(250,204,21,.55);border-color:#fff;color:#000;font-size:10px}
.key.sel{outline:3px solid #fff}
.key.sel::after{content:'';position:absolute;bottom:-3px;right:-3px;width:8px;height:8px;background:#fff;border:1px solid #000;cursor:se-resize;border-radius:50%}

.msg{color:var(--mut);font-size:13px;margin:0;white-space:nowrap}
.msg.wait{color:#facc15}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;width:100%;max-width:360px;text-align:center}
.modal-box h3{margin:0 0 16px;font-size:18px}
.modal-box input{width:100%;padding:10px;margin:10px 0;background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:8px;outline:none}
.modal-box button{width:100%;margin-top:10px}
</style>
</head>
<body>
<header>
  <div class="hl">
    <button id="gear" aria-label="القائمة">&#9881;&#xFE0E;</button>
    <div id="menu" hidden>
      <button id="mAbout">حول البرنامج</button>
      <button id="mAdminPanel">🔐 لوحة التحكم والإدارة</button>
    </div>
  </div>
  <div class="ttl"><b>MG </b> <span>Remote Center</span></div>
  <div class="hr">
    <button class="pri" id="conn"><i class="dot"></i>اتصال أردوينو</button>
    <span id="ok" hidden><i class="dot on"></i>متصل</span>
  </div>
</header>

<main>
  <section id="list">
    <input id="q" type="search" placeholder="ابحث باسم الريموت">
    <div class="grid" id="grid"></div>
    <p class="msg" id="listmsg" style="margin-top:12px;text-align:center"></p>
  </section>

  <section id="remote" hidden>
    <div class="bar">
      <button id="back">رجوع</button>
      <h2 id="rname"></h2>
      <p class="msg" id="msg"></p>
      <button class="bad" id="delRemote" hidden>حذف الريموت</button>
    </div>
    
    <div class="editor-layout">
      <div id="selbar" hidden>
        <div style="font-size:12px;color:var(--mut);text-align:center;font-weight:bold;border-bottom:1px solid var(--line);padding-bottom:4px">تعديل الزرار</div>
        <button id="renKey">تسمية: <span id="lblText" style="color:var(--acc)">-</span></button>
        <button id="shapeKey" style="background:#2563eb;border-color:#2563eb">الشكل: <span id="shapeLbl">دائرة</span></button>
        <button id="showCodeBtn" style="background:#059669;border-color:#059669">👁️ إظهار الكود</button>
        <button id="changeImgBtn" style="background:#d97706;border-color:#d97706">🖼️ تغيير صورة الريموت</button>
        <button id="renameRemoteBtn" style="background:#7c3aed;border-color:#7c3aed">✏️ تغيير اسم الريموت</button>
        <button class="bad" id="delKey">حذف الزرار</button>
      </div>

      <div class="stage" id="stage"></div>
    </div>
  </section>
</main>

<!-- نافذة إدخال كلمة السر للإدارة -->
<div id="passModal" class="modal-overlay" hidden>
  <div class="modal-box">
    <h3>كلمة سر الإدارة</h3>
    <p style="font-size:13px;color:var(--mut)">أدخل كلمة السر للوصول لخيارات التعديل والتصدير</p>
    <input type="password" id="passInput" placeholder="أدخل كلمة السر...">
    <button class="pri" id="passSubmit">دخول</button>
    <button id="passCancel" style="background:none;border:none;color:var(--mut);margin-top:10px">إلغاء</button>
  </div>
</div>

<!-- لوحة التحكم بعد إدخال كلمة السر الصحيحة -->
<div id="adminModal" class="modal-overlay" hidden>
  <div class="modal-box">
    <h3>لوحة التحكم والبيانات</h3>
    <button class="pri" id="btnAddRemote" style="margin-bottom:8px">➕ إضافة ريموت جديد</button>
    <button id="btnEditExisting" style="background:#2563eb;border-color:#2563eb;margin-bottom:8px">✏️ تعديل ريموت موجود</button>
    <button id="mExport" style="background:#059669;border-color:#059669;margin-bottom:8px">📤 تصدير ملف الريموتات (JSON)</button>
    <button id="mImport" style="background:#d97706;border-color:#d97706;margin-bottom:8px">📥 استيراد ريموتات</button>
    <button id="adminCancel" style="background:none;border:none;color:var(--mut);margin-top:10px">إغلاق</button>
  </div>
</div>

<div id="selectRemoteModal" class="modal-overlay" hidden>
  <div class="modal-box">
    <h3>اختر الريموت للتعديل</h3>
    <select id="remoteSelect" style="width:100%;padding:10px;margin:10px 0;background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:8px;outline:none"></select>
    <button class="pri" id="selectRemoteOk">فتح للتعديل</button>
    <button id="selectRemoteCancel" style="background:none;border:none;color:var(--mut);margin-top:10px">إلغاء</button>
  </div>
</div>

<div id="about" class="modal-overlay" hidden>
  <div class="modal-box">
    <h3>حول البرنامج</h3>
    <div class="lbl" style="color:var(--mut);font-size:13px">تم تطوير البرنامج من قبل</div>
    <div class="val" style="font-size:17px;font-weight:600;margin-top:4px">م/ محمد الجبيلي</div>
    <div class="lbl" style="color:var(--mut);font-size:13px;margin-top:12px">للدعم</div>
    <div class="val" style="font-size:17px;font-weight:600;margin-top:4px"><a href="https://wa.me/201028440566" style="color:var(--acc);text-decoration:none">01028440566</a></div>
    <button id="aboutClose" class="pri" style="margin-top:20px">إغلاق</button>
  </div>
</div>

<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="changeFileImg" accept="image/*" hidden>
<input type="file" id="importFile" accept=".json" hidden>

<script>
const $=s=>document.querySelector(s);
let db=[];
let cur=null,edit=false,sel=null,learn=null,port=null,writer=null;

let lastShape = 'circle';
let lastWidth = 38;
let lastHeight = 38;

const uid=()=>Math.random().toString(36).slice(2,9);

async function loadRemotesData(){
  try{
    const res = await fetch('remotes.json');
    if(res.ok){ db = await res.json(); }
    else{ throw new Error(); }
  }catch(e){
    try{db=JSON.parse(localStorage.getItem('irremotes')||'[]')}catch(err){db=[]}
  }
  renderList();
}

function save(){
  try{ localStorage.setItem('irremotes',JSON.stringify(db)); }catch(e){alert('مساحة التخزين امتلأت');}
}

function msg(t,wait){const m=$('#msg');if(m){m.textContent=t||'';m.classList.toggle('wait',!!wait);}}

/* القائمة الرئيسية للترس */
$('#gear').onclick=e=>{e.stopPropagation();$('#menu').hidden=!$('#menu').hidden};
document.addEventListener('click',()=>{$('#menu').hidden=true});
$('#mAbout').onclick=()=>{$('#about').hidden=false};
$('#aboutClose').onclick=()=>{$('#about').hidden=true};

/* حماية لوحة التحكم بكلمة السر */
$('#mAdminPanel').onclick=()=>{
  $('#passModal').hidden=false;
  $('#passInput').value='';
  $('#passInput').focus();
};
$('#passCancel').onclick=()=>{$('#passModal').hidden=true};
$('#passSubmit').onclick=()=>{
  if($('#passInput').value === 'Mo2005mo'){
    $('#passModal').hidden=true;
    $('#adminModal').hidden=false;
  } else {
    alert('❌ كلمة السر غير صحيحة!');
  }
};
$('#adminCancel').onclick=()=>{$('#adminModal').hidden=true};

/* خيارات لوحة التحكم */
$('#btnAddRemote').onclick=()=>{
  $('#adminModal').hidden=true;
  const wantImg = confirm('هل تريد إضافة صورة للريموت؟\n\n- (موافق) لاختيار صورة.\n- (إلغاء) لعمل ريموت بدون صورة (خلفية فقط).');
  const name = prompt('اسم الريموت (مثلا: شاشة الصالة):')||'ريموت جديد';
  
  if(wantImg){
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = async e=>{
      const f = e.target.files[0]; if(!f) return;
      const img = await shrink(f);
      const r = {id:uid(), name, img, buttons:[]};
      db.push(r); save(); openRemote(r.id, true);
    };
    inp.click();
  } else {
    const r = {id:uid(), name, img:'', buttons:[]};
    db.push(r); save(); openRemote(r.id, true);
  }
};

$('#btnEditExisting').onclick=()=>{
  $('#adminModal').hidden=true;
  if(!db.length){ alert('لا توجد ريموتات مسجلة بعد!'); return; }
  const selBox = $('#remoteSelect');
  selBox.innerHTML='';
  db.forEach(r=>{
    const opt = document.createElement('option');
    opt.value = r.id; opt.textContent = r.name;
    selBox.appendChild(opt);
  });
  $('#selectRemoteModal').hidden=false;
};
$('#selectRemoteCancel').onclick=()=>{$('#selectRemoteModal').hidden=true};
$('#selectRemoteOk').onclick=()=>{
  const id = $('#remoteSelect').value;
  $('#selectRemoteModal').hidden=true;
  if(id) openRemote(id, true);
};

$('#mExport').onclick=()=>{
  $('#adminModal').hidden=true;
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
  const dlAnchor = document.createElement('a');
  dlAnchor.setAttribute("href", dataStr);
  dlAnchor.setAttribute("download", "remotes.json");
  document.body.appendChild(dlAnchor);
  dlAnchor.click(); dlAnchor.remove();
  alert('💡 تم تنزيل ملف (remotes.json). ارفعه على جيت هاب لتحديث الريموتات للجميع!');
};

$('#mImport').onclick=()=>{
  $('#adminModal').hidden=true;
  $('#importFile').click();
};
$('#importFile').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload=event=>{
    try{
      db = JSON.parse(event.target.result);
      save(); renderList();
      alert('✅ تم استيراد الريموتات بنجاح!');
    }catch(err){ alert('❌ ملف غير صالح'); }
  };
  reader.readAsText(f); e.target.value='';
};

/* Serial connection */
function setConn(on){$('#conn').hidden=on;$('#ok').hidden=!on;if(!on){writer=null;port=null}}
async function connect(){
  if(!('serial' in navigator)){alert('استخدم متصفح كروم أو إيدج للاتصال بالأردوينو');return}
  try{
    port=await navigator.serial.requestPort();
    await port.open({baudRate:115200});
    writer=port.writable.getWriter();
    setConn(true); readLoop();
  }catch(e){setConn(false);alert('تعذر الاتصال بالأردوينو.')}
}
async function readLoop(){
  const dec=new TextDecoderStream();
  port.readable.pipeTo(dec.writable).catch(()=>{});
  const rd=dec.readable.getReader();
  let buf='';
  try{
    for(;;){
      const {value,done}=await rd.read();
      if(done)break;
      buf+=value;
      let i;
      while((i=buf.indexOf('\n'))>=0){onLine(buf.slice(0,i).trim());buf=buf.slice(i+1)}
    }
  }catch(e){}
  setConn(false);
}
function onLine(l){
  if(learn&&l.startsWith('RX,')&&!l.startsWith('RX,UNKNOWN')){
    const f=learn; learn=null; f(l);
  }
}
async function send(code){
  if(!code){alert('هذا الزرار ليس له كود مسجل!');return false}
  if(!writer){alert('يرجى توصيل الأردوينو أولاً');return false}
  await writer.write(new TextEncoder().encode(code+'\n'));
  return true;
}
if('serial' in navigator)navigator.serial.addEventListener('disconnect',()=>setConn(false));
$('#conn').onclick=connect;

function renderList(){
  const q=$('#q').value.trim().toLowerCase();
  const g=$('#grid'); g.innerHTML='';
  const items=db.filter(r=>r.name.toLowerCase().includes(q));
  items.forEach(r=>{
    const c=document.createElement('div'); c.className='card';
    c.innerHTML='<img><div></div>';
    if(r.img) c.querySelector('img').src=r.img;
    else c.querySelector('img').style.background='#222';
    c.querySelector('div').textContent=r.name;
    c.onclick=()=>openRemote(r.id, false);
    g.appendChild(c);
  });
  $('#listmsg').textContent=!db.length?'لا توجد ريموتات مضافة.':(!items.length?'لا توجد نتائج مطابقة':'');
}
$('#q').oninput=renderList;

function shrink(file){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{
      const s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=im.width*s; c.height=im.height*s;
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',.8));
    };
    im.src=URL.createObjectURL(file);
  });
}

function openRemote(id, startEdit){
  cur=db.find(r=>r.id===id); edit=!!startEdit; sel=null; learn=null;
  $('#list').hidden=true; $('#remote').hidden=false;
  $('#rname').textContent=cur.name;
  renderRemote();
}

function renderRemote(){
  const st=$('#stage'); st.innerHTML=''; st.classList.toggle('edit',edit);
  if(cur.img){
    const im=document.createElement('img'); im.src=cur.img; st.appendChild(im);
  } else {
    st.style.minHeight='500px';
  }
  cur.buttons.forEach(b=>st.appendChild(makeKey(b,st)));
  $('#delRemote').hidden=!edit;
  $('#selbar').hidden=true; sel=null;
  msg(edit?'وضع التعديل مفعل: اضغط لإضافة زرار، أو اضغط على أي زرار لتعديله':'');
}

$('#stage').onclick=e=>{
  if(!edit) return;
  if(e.target.closest('.key')) return;

  const st=$('#stage');
  const r=st.getBoundingClientRect();
  const x=((e.clientX-r.left)/r.width)*100;
  const y=((e.clientY-r.top)/r.height)*100;

  const newBtn={
    id:uid(),
    label:'زرار '+(cur.buttons.length+1),
    code:'',
    x:x, y:y,
    shape: lastShape,
    w: lastWidth,
    h: lastHeight
  };

  cur.buttons.push(newBtn);
  save(); renderRemote(); selectKey(newBtn.id);
};

function makeKey(b,st){
  const k=document.createElement('div'); k.className='key'; k.dataset.id=b.id; k.textContent=b.label;
  k.style.left=b.x+'%'; k.style.top=b.y+'%';
  k.style.width=(b.w||38)+'px'; k.style.height=(b.h||38)+'px';

  const shape=b.shape||'circle';
  if(shape==='circle') k.style.borderRadius='50%';
  else if(shape==='rect') k.style.borderRadius='6px';
  else if(shape==='pill') k.style.borderRadius='20px';

  let drag=false, resizing=false;
  let startX, startY, startW, startH;

  k.onpointerdown=e=>{
    if(!edit) return;
    e.stopPropagation();
    if(e.offsetX > k.offsetWidth - 12 && e.offsetY > k.offsetHeight - 12){
      resizing=true; startX=e.clientX; startY=e.clientY; startW=k.offsetWidth; startH=k.offsetHeight;
      k.setPointerCapture(e.pointerId); selectKey(b.id);
      return;
    }
    drag=true; k.setPointerCapture(e.pointerId); selectKey(b.id);
  };

  k.onpointermove=e=>{
    if(resizing){
      b.w = Math.max(6, startW + (e.clientX - startX));
      b.h = Math.max(6, startH + (e.clientY - startY));
      k.style.width=b.w+'px'; k.style.height=b.h+'px';
      lastWidth=b.w; lastHeight=b.h;
      return;
    }
    if(!drag) return;
    const r=st.getBoundingClientRect();
    b.x=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100));
    b.y=Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100));
    k.style.left=b.x+'%'; k.style.top=b.y+'%';
  };

  k.onpointerup=e=>{
    if(drag || resizing){ drag=false; resizing=false; save(); }
  };

  k.onwheel=e=>{
    if(!edit) return;
    e.preventDefault();
    const step = e.deltaY < 0 ? 2 : -2;
    b.w = Math.max(6, (b.w||38) + step);
    b.h = Math.max(6, (b.h||38) + step);
    k.style.width=b.w+'px'; k.style.height=b.h+'px';
    lastWidth=b.w; lastHeight=b.h; save();
  };

  k.onclick=async e=>{
    e.stopPropagation();
    if(edit){ selectKey(b.id); return; }
    if(await send(b.code)){k.classList.add('flash'); setTimeout(()=>k.classList.remove('flash'),150);}
  };
  return k;
}

function selectKey(id){
  sel=id;
  document.querySelectorAll('.key').forEach(el=>el.classList.toggle('sel',el.dataset.id===id));
  $('#selbar').hidden=!id;
  if(id){
    const b=selBtn();
    const shapes={'circle':'دائرة','rect':'مربع','pill':'بيضاوي'};
    $('#lblText').textContent=b.label;
    $('#shapeLbl').textContent=shapes[b.shape||'circle'];

    lastShape = b.shape||'circle';
    lastWidth = b.w||38;
    lastHeight = b.h||38;

    if(edit){
      if(!writer){ msg('وصّل الأردوينو أولاً'); return; }
      learn=code=>{
        b.code=code; save();
        msg('✅ تم التقاط الكود للزرار ('+b.label+'): '+code);
      };
      msg('📡 جاهز لاستقبال كود الزرار: "'+b.label+'"...', true);
    }
  }
}
const selBtn=()=>cur.buttons.find(b=>b.id===sel);

document.addEventListener('keydown', e=>{
  if(!edit || !cur || !cur.buttons.length) return;
  if(e.key === 'Tab'){
    e.preventDefault();
    let idx = cur.buttons.findIndex(b=>b.id === sel);
    if(e.shiftKey){ idx = (idx <= 0) ? cur.buttons.length - 1 : idx - 1; }
    else { idx = (idx < 0 || idx >= cur.buttons.length - 1) ? 0 : idx + 1; }
    selectKey(cur.buttons[idx].id);
  }
});

$('#renKey').onclick=()=>{
  const b=selBtn(); if(!b) return;
  const l=prompt('اسم الزرار:', b.label);
  if(l){ b.label=l; save(); renderRemote(); selectKey(sel); }
};

$('#shapeKey').onclick=()=>{
  const b=selBtn(); if(!b) return;
  const shapes=['circle','rect','pill'];
  b.shape=shapes[(shapes.indexOf(b.shape||'circle')+1)%shapes.length];
  lastShape = b.shape; save(); renderRemote(); selectKey(sel);
};

$('#showCodeBtn').onclick=()=>{
  const b=selBtn(); if(!b) return;
  if(!b.code) alert('هذا الزرار ليس له كود مسجل بعد.');
  else alert('كود الزرار (' + b.label + '):\n\n' + b.code);
};

$('#changeImgBtn').onclick = () => $('#changeFileImg').click();
$('#changeFileImg').onchange=async e=>{
  const f = e.target.files[0]; if(!f) return;
  const img = await shrink(f);
  cur.img = img;
  save(); renderRemote();
  alert('✅ تم تغيير صورة الريموت بنجاح!');
  e.target.value='';
};

$('#renameRemoteBtn').onclick=()=>{
  const newName = prompt('أدخل الاسم الجديد للريموت:', cur.name);
  if(newName){
    cur.name = newName;
    save();
    $('#rname').textContent = cur.name;
    alert('✅ تم تحديث اسم الريموت');
  }
};

$('#delKey').onclick=()=>{
  if(!sel || !confirm('حذف هذا الزرار؟')) return;
  cur.buttons=cur.buttons.filter(b=>b.id!==sel);
  save(); renderRemote();
};

$('#delRemote').onclick=()=>{
  if(!confirm('هل تريد حذف هذا الريموت بالكامل؟')) return;
  db=db.filter(r=>r!==cur); save(); $('#back').click();
};

$('#back').onclick=()=>{
  learn=null; cur=null; edit=false;
  $('#remote').hidden=true; $('#list').hidden=false;
  renderList();
};

loadRemotesData();
</script>
</body>
</html>
